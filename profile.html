<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Account – Dehra Fashion Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#111827;--navy-900:#0B0F1A;--amber:#F59E0B;--red:#EF4444;
    --white:#FFFFFF;--cream:#FAF7F1;--ink-soft:#5B6472;--line:#ECE7DD;
    --shadow-md:0 12px 30px rgba(17,24,39,.10);--ff-display:'Poppins',sans-serif;--ff-body:'Montserrat',sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--ff-body);color:var(--navy);background:var(--cream);}
  a{text-decoration:none;color:inherit;}
  .site-header{background:#fff;border-bottom:1px solid var(--line);}
  .header-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;max-width:1240px;margin:0 auto;}
  .logo{display:flex;align-items:center;gap:10px;font-family:var(--ff-display);font-weight:800;font-size:19px;}
  .logo-mark{width:36px;height:36px;border-radius:10px;background:var(--navy);display:flex;align-items:center;justify-content:center;color:var(--amber);}
  .logo span{color:var(--amber);}
  .icon-btn{padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:13px;font-weight:700;cursor:pointer;}

  .container{max-width:1040px;margin:32px auto;padding:0 28px;display:grid;grid-template-columns:260px 1fr;gap:28px;}
  .card{background:#fff;border-radius:20px;padding:26px;box-shadow:var(--shadow-md);}
  .avatar{width:56px;height:56px;border-radius:16px;background:var(--navy);color:var(--amber);font-family:var(--ff-display);font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;}
  h2{font-family:var(--ff-display);font-size:20px;margin:0 0 16px;}
  .order-card{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;}
  .status-tag{display:inline-block;background:#FEF3C7;color:#92400E;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;margin-top:6px;}

  @media(max-width:780px){.container{grid-template-columns:1fr;}}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-bar">
    <a href="index.html" class="logo"><span class="logo-mark">DF</span>Dehra <span>Fashion</span> Hub</a>
    <a href="index.html" class="icon-btn">Back to Store</a>
  </div>
</header>

<div class="container">
  <div class="card">
    <div class="avatar" id="userAvatar">D</div>
    <strong style="font-family:var(--ff-display);font-size:18px;display:block;" id="userName">Guest Shopper</strong>
    <span style="font-size:12.5px;color:var(--ink-soft);">Dehradun Club Member</span>
    <hr style="border:none;border-top:1px solid var(--line);margin:18px 0;">
    <button type="button" class="icon-btn" style="width:100%;color:var(--red);" onclick="logout()">Sign Out</button>
  </div>

  <div style="display:grid;gap:24px;">
    <div class="card">
      <h2>My Orders</h2>
      <div id="ordersList"></div>
    </div>
    <div class="card">
      <h2>Saved Wishlist</h2>
      <div id="wishList"></div>
    </div>
  </div>
</div>

<script>
  const user = localStorage.getItem('dfh_user') || 'Guest Shopper';
  document.getElementById('userName').textContent = user;
  document.getElementById('userAvatar').textContent = user.charAt(0).toUpperCase();

  function logout() {
    localStorage.removeItem('dfh_user');
    window.location.href = 'login.html';
  }

  const orders = JSON.parse(localStorage.getItem('dfh_orders') || '[]');
  document.getElementById('ordersList').innerHTML = orders.length ? orders.map(o => `
    <div class="order-card">
      <div style="display:flex;justify-content:space-between;font-weight:700;">
        <span>${o.id}</span>
        <span>₹${o.total.toLocaleString('en-IN')}</span>
      </div>
      <div style="font-size:12.5px;color:var(--ink-soft);margin-top:4px;">Placed on ${o.date}</div>
      <span class="status-tag">${o.status}</span>
    </div>
  `).join('') : `<p style="font-size:13.5px;color:var(--ink-soft);">No orders yet. <a href="shop.html" style="color:var(--amber);font-weight:700;">Start shopping →</a></p>`;

  const wish = JSON.parse(localStorage.getItem('dfh_wishlist') || '[]');
  document.getElementById('wishList').innerHTML = wish.length ? wish.map(w => `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);">
      <div><strong>${w.name}</strong> <span style="font-size:12.5px;color:var(--ink-soft);">· ₹${w.price.toLocaleString('en-IN')}</span></div>
      <a href="product-details.html?id=${w.id}" style="font-size:12.5px;font-weight:700;color:var(--amber);">View →</a>
    </div>
  `).join('') : `<p style="font-size:13.5px;color:var(--ink-soft);">Your wishlist is empty.</p>`;
</script>
</body>
</html>
