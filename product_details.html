<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Product Details – Dehra Fashion Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#111827;--navy-900:#0B0F1A;--navy-700:#1F2937;
    --amber:#F59E0B;--white:#FFFFFF;--cream:#FAF7F1;--ink-soft:#5B6472;--ink-faint:#9CA3AF;--line:#ECE7DD;
    --shadow-md:0 12px 30px rgba(17,24,39,.10);--ff-display:'Poppins',sans-serif;--ff-body:'Montserrat',sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--ff-body);color:var(--navy);background:var(--cream);}
  a{text-decoration:none;color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  .site-header{background:#fff;border-bottom:1px solid var(--line);}
  .header-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;max-width:1240px;margin:0 auto;}
  .logo{display:flex;align-items:center;gap:10px;font-family:var(--ff-display);font-weight:800;font-size:19px;}
  .logo-mark{width:36px;height:36px;border-radius:10px;background:var(--navy);display:flex;align-items:center;justify-content:center;color:var(--amber);}
  .logo span{color:var(--amber);}
  .icon-btn{padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:13px;font-weight:700;}
  .badge{background:var(--amber);color:var(--navy-900);font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;}

  .container{max-width:1120px;margin:36px auto;padding:0 28px;}
  .product-box{background:#fff;border-radius:22px;padding:36px;box-shadow:var(--shadow-md);display:grid;grid-template-columns:1fr 1fr;gap:42px;}
  .gallery{
    background:linear-gradient(145deg,#E5E7EB,#F3F4F6);border-radius:18px;min-height:380px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;
  }
  .gallery h3{font-family:var(--ff-display);font-size:22px;margin:8px 0 0;}
  .tag{font-size:11.5px;font-weight:700;color:var(--amber);text-transform:uppercase;letter-spacing:.12em;}
  h1{font-family:var(--ff-display);font-size:28px;margin:8px 0 12px;}
  .price{font-size:24px;font-weight:800;margin-bottom:16px;}
  .price del{font-size:15px;color:var(--ink-faint);font-weight:500;margin-left:8px;}
  .desc{font-size:14px;line-height:1.7;color:var(--ink-soft);margin-bottom:24px;}
  .size-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:10px;}
  .sizes{display:flex;gap:10px;margin-bottom:26px;}
  .size-btn{width:46px;height:46px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:13.5px;}
  .size-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .cta-row{display:flex;gap:12px;margin-bottom:22px;}
  .btn-primary{flex:1;padding:15px 24px;border-radius:999px;border:none;background:var(--amber);color:var(--navy-900);font-weight:700;font-size:14px;}
  .btn-wish{padding:15px 20px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:13.5px;}
  .specs{border-top:1px solid var(--line);padding-top:18px;font-size:13px;color:var(--ink-soft);display:grid;gap:8px;}

  @media(max-width:860px){.product-box{grid-template-columns:1fr;}}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-bar">
    <a href="index.html" class="logo"><span class="logo-mark">DF</span>Dehra <span>Fashion</span> Hub</a>
    <div style="display:flex;gap:12px;">
      <a href="shop.html" class="icon-btn">← Catalog</a>
      <a href="cart.html" class="icon-btn">Bag <span class="badge" id="cartCount">0</span></a>
    </div>
  </div>
</header>

<div class="container">
  <div class="product-box" id="detailContainer"></div>
</div>

<script>
  const CATALOG = [
    { id: 1, name: "Rajpur Handloom Linen Shirt", cat: "Men", price: 1699, mrp: 2299, fabric: "100% Pure European Flax Linen", desc: "Breathable regular-fit shirt pre-washed for softness. Ideal for sunny Doon afternoons and layered evening outings." },
    { id: 2, name: "Mussoorie Merino Knit Cardigan", cat: "Women", price: 2499, mrp: 3199, fabric: "Fine Merino Wool & Cotton Blend", desc: "Lightweight yet cosy button-down cardigan crafted for crisp mountain evenings." },
    { id: 3, name: "Kalsi Indigo Cotton Kurta Set", cat: "Ethnic", price: 2199, mrp: 2899, fabric: "Hand-blocked Mulmul Cotton", desc: "Artisanal indigo-dyed straight kurta paired with relaxed tapered trousers." },
    { id: 4, name: "Doon Valley Quilted Overshirt", cat: "Winter", price: 2799, mrp: 3499, fabric: "Diamond-Quilted Brushed Twill", desc: "Structured shacket with antique brass snaps and fleece-lined pockets." },
    { id: 5, name: "Chanderi Silk Festive Anarkali", cat: "Ethnic", price: 3899, mrp: 4999, fabric: "Pure Chanderi Silk with Cotton Lining", desc: "Flowing floor-length silhouette finished with delicate zari border detailing." },
    { id: 6, name: "Pleated Olive Tapered Chinos", cat: "Men", price: 1499, mrp: 1999, fabric: "Stretch Organic Cotton Twill", desc: "Tailored everyday trousers with a clean ankle taper and breathable weave." },
    { id: 7, name: "Rishikesh Breeze Cotton Co-ord", cat: "Women", price: 1899, mrp: 2499, fabric: "Slub Handloom Cotton", desc: "Relaxed camp-collar shirt and wide-leg trousers designed for effortless travel." },
    { id: 8, name: "Himalayan Fleece Zip Jacket", cat: "Winter", price: 2299, mrp: 2999, fabric: "High-Pile Anti-Pill Polar Fleece", desc: "High-neck insulating fleece jacket built for chilly Dehradun mornings." }
  ];

  const id = Number(new URLSearchParams(window.location.search).get('id')) || 1;
  const product = CATALOG.find(p => p.id === id) || CATALOG[0];
  let selectedSize = 'M';

  function updateCartBadge() {
    const cart = JSON.parse(localStorage.getItem('dfh_cart') || '[]');
    document.getElementById('cartCount').textContent = cart.reduce((s, i) => s + i.qty, 0);
  }

  function addBag() {
    const cart = JSON.parse(localStorage.getItem('dfh_cart') || '[]');
    const found = cart.find(c => c.id === product.id && c.size === selectedSize);
    if (found) found.qty += 1;
    else cart.push({ ...product, size: selectedSize, qty: 1 });
    localStorage.setItem('dfh_cart', JSON.stringify(cart));
    updateCartBadge();
    alert(`Added ${product.name} (${selectedSize}) to your bag!`);
  }

  function saveWishlist() {
    const wish = JSON.parse(localStorage.getItem('dfh_wishlist') || '[]');
    if (!wish.find(w => w.id === product.id)) {
      wish.push(product);
      localStorage.setItem('dfh_wishlist', JSON.stringify(wish));
    }
    alert('Saved to your wishlist!');
  }

  document.getElementById('detailContainer').innerHTML = `
    <div class="gallery">
      <span class="tag">${product.cat} Collection</span>
      <h3>${product.name}</h3>
      <p style="font-size:12.5px;color:var(--ink-soft);margin-top:8px;">In Stock at Rajpur Road Flagship</p>
    </div>
    <div>
      <span class="tag">${product.cat}</span>
      <h1>${product.name}</h1>
      <div class="price">₹${product.price.toLocaleString('en-IN')} <del>₹${product.mrp.toLocaleString('en-IN')}</del></div>
      <p class="desc">${product.desc}</p>

      <span class="size-label">Select Size</span>
      <div class="sizes" id="sizePicker">
        ${['S', 'M', 'L', 'XL'].map(sz => `<button type="button" class="size-btn ${sz === 'M' ? 'active' : ''}" data-sz="${sz}">${sz}</button>`).join('')}
      </div>

      <div class="cta-row">
        <button type="button" class="btn-primary" onclick="addBag()">Add to Shopping Bag</button>
        <button type="button" class="btn-wish" onclick="saveWishlist()">♡ Save</button>
      </div>

      <div class="specs">
        <div><strong>Fabric:</strong> ${product.fabric}</div>
        <div><strong>Delivery:</strong> Same-day express across Dehradun (Order before 4 PM)</div>
        <div><strong>Returns:</strong> Easy 7-day doorstep size exchange</div>
      </div>
    </div>
  `;

  document.querySelectorAll('.size-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedSize = btn.dataset.sz;
    });
  });

  updateCartBadge();
</script>
</body>
</html>
