<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact &amp; Store Locator – Dehra Fashion Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#111827;--navy-900:#0B0F1A;--amber:#F59E0B;--white:#FFFFFF;--cream:#FAF7F1;
    --ink-soft:#5B6472;--line:#ECE7DD;--shadow-md:0 12px 30px rgba(17,24,39,.10);
    --ff-display:'Poppins',sans-serif;--ff-body:'Montserrat',sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--ff-body);color:var(--navy);background:var(--cream);}
  a{text-decoration:none;color:inherit;}
  input,textarea,button{font-family:inherit;}
  .site-header{background:#fff;border-bottom:1px solid var(--line);}
  .header-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;max-width:1240px;margin:0 auto;}
  .logo{display:flex;align-items:center;gap:10px;font-family:var(--ff-display);font-weight:800;font-size:19px;}
  .logo-mark{width:36px;height:36px;border-radius:10px;background:var(--navy);display:flex;align-items:center;justify-content:center;color:var(--amber);}
  .logo span{color:var(--amber);}
  .icon-btn{padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:13px;font-weight:700;}

  .container{max-width:1040px;margin:36px auto;padding:0 28px;display:grid;grid-template-columns:1fr 1fr;gap:28px;}
  .card{background:#fff;border-radius:20px;padding:32px;box-shadow:var(--shadow-md);}
  h2{font-family:var(--ff-display);font-size:22px;margin:0 0 14px;}
  .input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:13.5px;margin-bottom:14px;}
  .btn{width:100%;padding:14px;border:none;border-radius:999px;background:var(--amber);color:var(--navy-900);font-weight:700;font-size:14px;cursor:pointer;}

  @media(max-width:780px){.container{grid-template-columns:1fr;}}
</style>
</head>
<body>
<header class="site-header">
  <div class="header-bar">
    <a href="index.html" class="logo"><span class="logo-mark">DF</span>Dehra <span>Fashion</span> Hub</a>
    <a href="index.html" class="icon-btn">Back to Home</a>
  </div>
</header>

<div class="container">
  <div class="card">
    <h2>Visit Our Flagship Store</h2>
    <p style="font-size:14px;color:var(--ink-soft);line-height:1.7;">
      <strong>Address:</strong> 142 Rajpur Road, Near Jakhan Chowk, Dehradun, Uttarakhand 248001<br><br>
      <strong>Store Hours:</strong> Monday – Sunday, 10:30 AM to 9:00 PM<br><br>
      <strong>WhatsApp &amp; Phone:</strong> +91 135 274 8890<br>
      <strong>Support Email:</strong> care@dehrafashionhub.in
    </p>
  </div>

  <form class="card" id="contactForm">
    <h2>Send Us a Message</h2>
    <input type="text" class="input" placeholder="Your Name" required />
    <input type="email" class="input" placeholder="Email or Phone Number" required />
    <textarea class="input" rows="4" placeholder="How can we help with your order or sizing?" required></textarea>
    <button type="submit" class="btn">Submit Inquiry</button>
    <p id="contactStatus" style="font-size:13px;color:#065F46;font-weight:600;margin-top:12px;"></p>
  </form>
</div>

<script>
  document.getElementById('contactForm').addEventListener('submit', (e) => {
    e.preventDefault();
    document.getElementById('contactStatus').textContent = 'Thank you! Our Rajpur Road team will reply within 2 hours.';
    e.target.reset();
  });
</script>
</body>
</html>
